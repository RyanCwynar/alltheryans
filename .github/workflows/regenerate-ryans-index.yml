name: Regenerate ryans index

on:
  push:
    paths:
      - "ryans/**.md"
      - "scripts/generate-ryans-index.py"
      - ".github/workflows/regenerate-ryans-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ryans/index.json
        run: python3 scripts/generate-ryans-index.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- ryans/index.json; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ryans/index.json
          git commit -m "chore: regenerate ryans/index.json"
          git push
